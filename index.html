    <!-- SPA redirect restore: khôi phục path đã được 404.html encode vào query string -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          var q = params.get('q');
          var newSearch = q ? '?' + q.replace(/~and~/g, '&') : '';
          var newPath =
            window.location.pathname.replace(/\/$/, '') +
            p.replace(/~and~/g, '&') +
            newSearch +
            window.location.hash;
          window.history.replaceState(null, null, newPath);
        }
      })();
    </script>
